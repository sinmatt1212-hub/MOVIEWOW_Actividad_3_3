    plan: free
    rootDir: MOVIEWOW_Actividad_3_3
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_URL
        sync: false
