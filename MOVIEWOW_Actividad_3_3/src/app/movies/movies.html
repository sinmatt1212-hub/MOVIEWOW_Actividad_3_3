<div class="container py-5">
  <h2 class="text-center mb-4"><i class="bi bi-film"></i> Cartelera MOVIEWOW</h2>
  <p class="text-center lead">Explora y administra nuestro catálogo de películas.</p>
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-warning" (click)="nueva()"><i class="bi bi-plus-circle"></i> Agregar película</button>
  </div>
  <div *ngIf="mensaje" class="alert alert-info">{{ mensaje }}</div>
  <div *ngIf="cargando" class="text-center mb-3">Cargando películas...</div>
  <div *ngIf="formularioVisible" class="card bg-dark text-white border-warning mb-4">
    <div class="card-body">
      <h3 class="h5">{{ editando === null ? 'Agregar película' : 'Editar película' }}</h3>
      <form (ngSubmit)="guardar()">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Título</label><input class="form-control" name="titulo" [(ngModel)]="formulario.titulo" required maxlength="150"></div>
          <div class="col-md-3"><label class="form-label">Año</label><input class="form-control" type="number" name="anio" [(ngModel)]="formulario.anio" required min="1888" max="2200"></div>
          <div class="col-md-3"><label class="form-label">Género</label><input class="form-control" name="genero" [(ngModel)]="formulario.genero" required maxlength="100"></div>
          <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" [(ngModel)]="formulario.descripcion" rows="3" maxlength="2000"></textarea></div>
        </div>
        <div class="mt-3 d-flex gap-2"><button type="submit" class="btn btn-warning">Guardar</button><button type="button" class="btn btn-outline-light" (click)="formularioVisible=false">Cancelar</button></div>
      </form>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-dark table-striped table-hover align-middle">
      <thead><tr><th>Película</th><th>Año</th><th>Género</th><th>Acciones</th></tr></thead>
      <tbody>
        <tr *ngFor="let p of peliculas">
          <td>{{ p.titulo }}</td><td>{{ p.anio }}</td><td>{{ p.genero }}</td>
          <td><div class="d-flex flex-wrap gap-2">
            <a [routerLink]="['/movie',p.id]" class="btn btn-warning btn-sm"><i class="bi bi-eye"></i> Ver</a>
            <button class="btn btn-outline-light btn-sm" (click)="editar(p)"><i class="bi bi-pencil"></i> Editar</button>
            <button class="btn btn-outline-danger btn-sm" (click)="eliminar(p)"><i class="bi bi-trash"></i> Eliminar</button>
          </div></td>
        </tr>
        <tr *ngIf="!cargando && peliculas.length === 0"><td colspan="4">No hay películas registradas.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="text-center mt-4"><a routerLink="/" class="btn btn-outline-warning"><i class="bi bi-house-door"></i> Volver al inicio</a></div>
</div>
